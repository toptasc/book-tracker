{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full mb-2">
            <i class="fa-solid fa-user-lock text-xl"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800">Veli / Admin Girişi</h2>
        <p class="text-xs text-slate-500 mt-1">Kitap eklemek ve düzenlemek için giriş yapın.</p>
    </div>

    <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kullanıcı Adı</label>
            <input type="text" name="username" required placeholder="veli"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Şifre</label>
            <input type="password" name="password" required placeholder="••••••••"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition shadow-sm">
            Giriş Yap
        </button>
    </form>
</div>
{% endblock %}
